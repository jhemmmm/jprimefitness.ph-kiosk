plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kiosklocktask'
version = '0.0.1'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.kiosklocktask'
